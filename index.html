</style></head><body><div class="wrap"><header class="hero"><h1>English 8 – Reading Units 1, 2 &amp; 3</h1><p>SBT Tiếng Anh 8 · Global Success</p><p>Chọn đáp án để chấm ngay. Mỗi câu chỉ được trả lời một lần; sau khi chọn sẽ khóa đáp án và hiện giải thích cùng nghĩa tiếng Việt.</p></header><div id="login" class="login"><h2>🔐 Vào làm bài</h2><label for="pw">Mật khẩu</label><input id="pw" type="password" inputmode="numeric" placeholder="Nhập mật khẩu"><button class="btn" onclick="unlock()">Bắt đầu</button><p id="msg" class="small"></p></div><main id="app" style="display:none"><div id="tabs" class="tabs"></div><div id="units"></div></main></div>
<script>
const units=[
{title:'Unit 1 – Leisure time',sets:[
{title:'Bài 1 – Email điền từ',passage:'Dear Nick,\\nI’m so happy to receive your email. Now I’m going to (1) _____ you about my leisure activities.\\nIt may sound strange, but the leisure activity I like (2) _____ is volunteering. There is a volunteer club in my (3) _____. Last year I took part in one of their programmes. I really enjoyed the activities, so I decided to (4) _____ a member. Our volunteer club mostly helps the (5) _____ in our neighbourhood. We go to their home and help them with housework. We also talk and read (6) _____ to them.\\nBesides volunteering, I also love drawing and (7) _____ DIY. I can make paper flowers and flower vases from used bottles.\\n(8) _____ about you? What do you like doing in your free time? Tell me.\\nBest wishes,\\nMinh',vi:'Nick thân mến,\\nMình rất vui khi nhận được thư của bạn. Bây giờ mình sẽ kể cho bạn nghe về các hoạt động giải trí của mình. Nghe có vẻ lạ, nhưng hoạt động giải trí mình thích nhất là tình nguyện. Có một câu lạc bộ tình nguyện trong khu phố của mình. Năm ngoái mình tham gia một chương trình của họ. Mình rất thích các hoạt động nên quyết định trở thành thành viên. Câu lạc bộ chủ yếu giúp đỡ người cao tuổi trong khu phố. Chúng mình đến nhà họ giúp làm việc nhà, trò chuyện và đọc sách cho họ nghe. Ngoài tình nguyện, mình còn thích vẽ và làm đồ thủ công. Mình có thể làm hoa giấy và lọ hoa từ chai đã qua sử dụng. Còn bạn thì sao? Bạn thích làm gì lúc rảnh? Hãy kể cho mình nhé. Thân mến, Minh.',items:[
['Blank (1): I’m going to _____ you about my leisure activities.',['tell','say','speak','talk'],0,'Cấu trúc “tell someone about something” nghĩa là kể cho ai nghe về điều gì.','Bây giờ mình sẽ kể cho bạn nghe về các hoạt động giải trí của mình.'],
['Blank (2): the leisure activity I like _____ is volunteering.',['good','better','best','well'],2,'“Like … best” nghĩa là thích nhất.','Hoạt động giải trí mình thích nhất là tình nguyện.'],
['Blank (3): There is a volunteer club in my _____.',['neighbourhood','neighbour','neighbouring','neighbourhoods'],0,'Sau “my” cần danh từ; “neighbourhood” là khu phố.','Có một câu lạc bộ tình nguyện trong khu phố của mình.'],
['Blank (4): I decided to _____ a member.',['do','become','make','take'],1,'Cụm “become a member” nghĩa là trở thành thành viên.','Mình quyết định trở thành thành viên.'],
['Blank (5): helps the _____ in our neighbourhood.',['elderly','young','rich','healthy'],0,'“The elderly” nghĩa là người cao tuổi.','Câu lạc bộ giúp đỡ người cao tuổi trong khu phố.'],
['Blank (6): read _____ to them.',['newspapers','books','letters','magazines'],1,'Cụm tự nhiên trong đáp án là “read books to them” – đọc sách cho họ nghe.','Chúng mình đọc sách cho họ nghe.'],
['Blank (7): drawing and _____ DIY.',['doing','making','having','taking'],0,'Cụm “do DIY” nghĩa là tự làm đồ thủ công/đồ dùng.','Mình thích vẽ và làm đồ thủ công.'],
['Blank (8): _____ about you?',['How','What','Which','Who'],1,'Cụm “What about you?” dùng để hỏi lại người đối thoại.','Còn bạn thì sao?']
]},
{title:'Bài 2 – Mountain climbing',passage:'There are a lot of pastimes that young people like, and one of (1) _____ is mountain climbing. It is an active leisure activity that people can do either indoors or outdoors. If you go climbing outdoors, it is a great way to (2) _____ your strength and enjoy nature at the same time. You can even set up your own climbing wall in your backyard or (3) _____ your home. This way you don’t have to go out and still can (4) _____ fit and enjoy the activity.\\nSo how can you start mountain climbing? Many people take a class to learn how to climb and use their equipment (5) _____. Others join climbing clubs to make new friends with the same interest and go climbing together. If you are an active person and like outdoor activities, (6) _____ don’t you try this activity?',vi:'Có nhiều thú tiêu khiển mà giới trẻ yêu thích, và một trong số đó là leo núi. Đây là hoạt động giải trí năng động có thể thực hiện trong nhà hoặc ngoài trời. Nếu leo núi ngoài trời, đó là cách tuyệt vời để tăng cường sức mạnh và đồng thời tận hưởng thiên nhiên. Bạn thậm chí có thể dựng tường leo núi riêng ở sân sau hoặc bên trong nhà. Như vậy bạn không cần ra ngoài mà vẫn có thể giữ dáng và tận hưởng hoạt động. Vậy làm thế nào để bắt đầu leo núi? Nhiều người tham gia lớp học để học cách leo và sử dụng thiết bị hiệu quả. Những người khác tham gia câu lạc bộ leo núi để kết bạn cùng sở thích. Nếu bạn năng động và thích hoạt động ngoài trời, tại sao không thử hoạt động này?',items:[
['Blank (1): one of _____ is mountain climbing.',['they','them','their','theirs'],1,'Sau “of” dùng đại từ tân ngữ “them”: one of them.','Một trong số những thú tiêu khiển đó là leo núi.'],
['Blank (2): a great way to _____ your strength.',['increase','grow up','rise','lift up'],0,'“Increase your strength” nghĩa là tăng cường sức mạnh.','Đó là cách tuyệt vời để tăng cường sức mạnh.'],
['Blank (3): _____ your home.',['inside','outside','between','above'],0,'Tường leo núi có thể đặt trong nhà: “inside your home”.','Bạn có thể dựng tường leo núi bên trong nhà.'],
['Blank (4): can _____ fit.',['keep','make','do','stay up'],0,'Cụm “keep fit” nghĩa là giữ dáng, duy trì thể lực.','Bạn vẫn có thể giữ dáng và tận hưởng hoạt động.'],
['Blank (5): use their equipment _____.',['effective','effectively','effect','effects'],1,'Động từ “use” cần trạng từ bổ nghĩa: effectively (một cách hiệu quả).','Học cách sử dụng thiết bị một cách hiệu quả.'],
['Blank (6): _____ don’t you try this activity?',['what','why','when','where'],1,'Cấu trúc gợi ý: “Why don’t you + V nguyên mẫu?”','Tại sao bạn không thử hoạt động này?']
]},
{title:'Bài 3a – Knitting: nối từ với nghĩa',passage:'My grandma and I share a pastime: knitting. She taught me how to knit when I was ten years old. In the evening, we both sit in front of the TV and knit. Now I can knit scarves, hats, and even sweaters. I remember last year I had to find a birthday present for my dad. Then I thought of knitting a sweater for him. I searched the Internet for a day, and finally I found the pattern that came with a YouTube video showing me how to make a sweater. It took me a week to finish it.\\nDad was so happy with the present and said it was his favourite sweater. The best thing about knitting is that it makes you be more careful and patient. Sometimes you drop stitches or hold the wool too tight, so you need to continually practise. My grandma says knitting is magical because you can create anything you want with just wool and a pair of needles. I love knitting!',vi:'Bà tôi và tôi có chung một thú tiêu khiển: đan len. Bà dạy tôi đan khi tôi mười tuổi. Buổi tối, cả hai ngồi trước TV và đan. Bây giờ tôi có thể đan khăn quàng, mũ và cả áo len. Năm ngoái tôi cần tìm quà sinh nhật cho bố nên nghĩ đến việc đan áo len cho bố. Tôi tìm trên Internet một ngày và cuối cùng tìm được mẫu có video YouTube hướng dẫn cách đan áo. Tôi mất một tuần để hoàn thành. Bố rất vui và nói đó là chiếc áo len yêu thích. Điều tuyệt nhất của việc đan len là nó khiến bạn cẩn thận và kiên nhẫn hơn. Đôi khi bạn làm tuột mũi đan hoặc giữ len quá chặt nên cần luyện tập liên tục. Bà nói đan len thật kỳ diệu vì chỉ với len và một đôi kim, bạn có thể tạo ra bất cứ thứ gì. Tôi yêu việc đan len!',items:[
['“Pastime” means _____.',['something you enjoy doing in your free time','a school subject','a type of clothing','a tool for knitting'],0,'Pastime là thú tiêu khiển – việc bạn thích làm khi không phải làm việc.','Bà tôi và tôi có chung một thú tiêu khiển: đan len.'],
['A “pattern” is _____.',['a design used to make something','a pair of needles','a kind of wool','a finished sweater'],0,'Pattern trong ngữ cảnh này là mẫu/thiết kế dùng để làm ra sản phẩm.','Tôi tìm được mẫu hướng dẫn đan áo len.'],
['“Stitches” are _____.',['small loops of wool made when knitting','knitting machines','clothes for dolls','wool colours'],0,'Stitches là các mũi đan, những vòng len được tạo bằng kim đan.','Đôi khi bạn làm tuột mũi đan.'],
['“Magical” means _____.',['having a special, almost amazing quality','very boring','very expensive','easy to break'],0,'Magical nghĩa là kỳ diệu, có phẩm chất đặc biệt như phép màu.','Bà nói đan len thật kỳ diệu.'],
['“Needles” are _____.',['long thin tools with a point used for knitting','pieces of cloth','wool balls','patterns on paper'],0,'Needles là kim đan, dụng cụ dài, mảnh, có đầu nhọn dùng để đan len.','Bạn có thể tạo ra nhiều thứ với len và một đôi kim đan.']
]},
{title:'Bài 3b – Knitting: True / False',passage:'My grandma and I share a pastime: knitting. She taught me how to knit when I was ten years old. I searched the Internet for a day, and finally I found the pattern that came with a YouTube video showing me how to make a sweater. It took me a week to finish it. Dad was so happy with the present. The best thing about knitting is that it makes you be more careful and patient. My grandma says knitting is magical.',vi:'Bà tôi và tôi có chung một thú tiêu khiển: đan len. Bà dạy tôi đan khi tôi mười tuổi. Tôi tìm trên Internet một ngày và cuối cùng tìm được mẫu có video YouTube hướng dẫn cách đan áo. Tôi mất một tuần để hoàn thành. Bố rất vui với món quà. Điều tuyệt nhất của việc đan len là nó khiến bạn cẩn thận và kiên nhẫn hơn. Bà tôi nói đan len thật kỳ diệu.',items:[
['The girl started knitting when she was in grade 10.',['True','False'],1,'Bài đọc nói bà dạy cô đan khi cô mười tuổi, không phải khi học lớp 10.','Cô gái bắt đầu đan len khi học lớp 10. (Sai)'],
['She found the pattern for her dad’s sweater online.',['True','False'],0,'Bài đọc nói cô tìm mẫu trên Internet.','Cô tìm mẫu áo len của bố trên mạng. (Đúng)'],
['She spent more than a week knitting the sweater.',['True','False'],1,'Cô mất đúng một tuần để hoàn thành áo len, không phải hơn một tuần.','Cô mất hơn một tuần để đan áo len. (Sai)'],
['Knitting makes people more careful and patient.',['True','False'],0,'Đoạn văn nêu rõ đan len khiến người ta cẩn thận và kiên nhẫn hơn.','Đan len khiến mọi người cẩn thận và kiên nhẫn hơn. (Đúng)'],
['The girl’s dad says knitting is magical.',['True','False'],1,'Người nói đan len kỳ diệu là bà của cô gái, không phải bố.','Bố cô gái nói đan len là điều kỳ diệu. (Sai)']
]}]},
{title:'Unit 2 – Life in the countryside',sets:[
{title:'Bài 1 – Countryside (điền từ)',passage:'I live in a small village in Ninh Binh. I love the (1) _____ peace and quiet of my village. The air is unpolluted, and the (2) _____ of life is slow. The people in my village are friendly and hospitable. They are always willing (3) _____ each other. We cultivate mainly rice and beans. We raise cows and buffaloes too. We can also enjoy (4) _____ in the nearby area. It is actually a national park, so the wildlife there can live and move about (5) _____. All these things make me love my village more and intend to live here my whole life.',vi:'Tôi sống trong một ngôi làng nhỏ ở Ninh Bình. Tôi yêu sự yên bình và tĩnh lặng của vùng nông thôn nơi mình sống. Không khí không ô nhiễm và nhịp sống chậm rãi. Người dân thân thiện, hiếu khách và luôn sẵn lòng giúp đỡ nhau. Chúng tôi chủ yếu trồng lúa và đậu, đồng thời nuôi bò và trâu. Chúng tôi cũng có thể tận hưởng thiên nhiên ở khu vực gần đó. Đó thực ra là một công viên quốc gia nên động vật hoang dã có thể sống và di chuyển an toàn. Tất cả những điều này khiến tôi yêu ngôi làng hơn và muốn sống ở đây suốt đời.',items:[
['Blank (1): I love the _____ peace and quiet of my village.',['urban','rural','suburban'],1,'Rural nghĩa là thuộc nông thôn; “rural peace and quiet” là sự yên bình của vùng quê.','Tôi yêu sự yên bình và tĩnh lặng của vùng nông thôn.'],
['Blank (2): the _____ of life is slow.',['speed','step','pace'],2,'“Pace of life” là nhịp sống.','Nhịp sống chậm rãi.'],
['Blank (3): willing _____ each other.',['to help','helping','help'],0,'Cấu trúc “be willing to do something” nghĩa là sẵn lòng làm gì.','Họ luôn sẵn lòng giúp đỡ lẫn nhau.'],
['Blank (4): enjoy _____ in the nearby area.',['nature','environment','countryside'],0,'“Enjoy nature” là tận hưởng thiên nhiên.','Chúng tôi có thể tận hưởng thiên nhiên ở khu vực gần đó.'],
['Blank (5): live and move about _____.',['safe','safety','safely'],2,'Sau động từ “move about” cần trạng từ “safely” để bổ nghĩa.','Động vật hoang dã có thể sống và di chuyển an toàn.']
]},
{title:'Bài 2 – Countryside in Britain',passage:'Besides its beauty, the countryside of Britain is well known for many contrasts: its bare mountains and moorland, its lakes, rivers and woods, and its long, often wild coastline. National parks which are protected from development by the government have the most beautiful and picturesque scenery. British people often associate the countryside with farmland, open spaces like fields of wheat and barley, green fields enclosed by hedges or stone walls in which cows or sheep are raised. Most farmland is now owned by individual people or independent companies. However, the government has built a network of public footpaths across the farmland.\\nMany British people enjoy the peace and relaxation of life in the countryside where they can spend their free time walking, cycling, or going for a picnic or a pub lunch. In summer they can pick strawberries and other fruit in fruit farms. Nowadays, few rural people work on farms. Many of them commute to work in towns. Many others wish to live in the countryside so that they would have a better and healthier lifestyle.',vi:'Ngoài vẻ đẹp, vùng nông thôn nước Anh nổi tiếng với nhiều cảnh quan tương phản: núi trọc, đồng hoang, hồ, sông, rừng và đường bờ biển dài, thường hoang sơ. Các công viên quốc gia được chính phủ bảo vệ khỏi phát triển xây dựng có phong cảnh đẹp như tranh. Người Anh thường liên tưởng nông thôn với đất nông nghiệp, những cánh đồng lúa mì và lúa mạch, đồng cỏ xanh có hàng rào hoặc tường đá nơi nuôi bò và cừu. Hầu hết đất nông nghiệp hiện thuộc sở hữu cá nhân hoặc công ty độc lập. Chính phủ đã xây dựng mạng lưới lối đi bộ công cộng xuyên qua các vùng đất này.\\nNhiều người Anh thích sự yên bình và thư thái ở nông thôn, nơi họ có thể đi bộ, đạp xe, dã ngoại hoặc ăn trưa ở quán rượu. Mùa hè họ có thể hái dâu và trái cây khác. Ngày nay ít người nông thôn làm việc ở trang trại; nhiều người đi làm ở thị trấn. Những người khác muốn sống ở nông thôn để có lối sống tốt hơn và lành mạnh hơn.',items:[
['The countryside of Britain is NOT famous for its _____.',['farmland','moorland','bare mountains','lakes, rivers and woods'],0,'Đoạn văn nêu moorland, bare mountains, lakes, rivers, woods và coastline; câu hỏi yêu cầu điều KHÔNG nổi tiếng, đáp án theo lời giải là farmland.','Vùng nông thôn Anh không nổi tiếng với đất nông nghiệp.'],
['Individual people or independent companies own _____.',['some footpaths','most farmland in Britain','all national parks','all public footpaths'],1,'Bài đọc nêu “Most farmland is now owned by individual people or independent companies.”','Cá nhân hoặc công ty độc lập sở hữu phần lớn đất nông nghiệp ở Anh.'],
['Many British people associate the countryside with _____.',['work in towns','work on farms only','peace and relaxation','busy city life'],2,'Đoạn văn nói nhiều người Anh tận hưởng sự yên bình và thư thái ở nông thôn.','Nhiều người Anh gắn vùng nông thôn với sự yên bình và thư thái.'],
['“Commute” is closest in meaning to _____.',['travel regularly between home and work','walk for pleasure','go on holiday','stay at home'],0,'Commute nghĩa là đi lại thường xuyên giữa nhà và nơi làm việc.','Nhiều người đi lại để làm việc ở thị trấn.'],
['The word “they” in “so that they would have a better lifestyle” refers to _____.',['people who commute to towns','people who go for a picnic','people who pick fruit','people who wish to live in the countryside'],3,'“They” thay cho “many others” – những người muốn sống ở vùng nông thôn.','Họ muốn sống ở nông thôn để có lối sống tốt hơn.']
]},
{title:'Bài 3 – Countryside in America',passage:'Few Americans live in the areas of wild and beautiful scenery, like the Western states of Montana and Wyoming. We often see small farms surrounded by hills and green areas in the New England states, such as Vermont and New Hampshire. In Ohio, Indiana, Illinois and other Midwestern states, there are very large fields of corn or wheat with great distances between towns.\\nAbout a quarter of Americans live outside cities and towns because life there is harder. Shops, post offices, hospitals, schools, etc. may be further away and it takes rural people a very long time to get there. However, many people choose to live in the countryside because of its safe, clean, and attractive environment. But their children often move to a town or city when they grow up.',vi:'Rất ít người Mỹ sống ở những vùng có phong cảnh hoang sơ, tươi đẹp như các bang miền Tây Montana và Wyoming. Ở các bang New England như Vermont và New Hampshire, thường có những trang trại nhỏ được bao quanh bởi đồi và vùng xanh. Ở Ohio, Indiana, Illinois và các bang Trung Tây khác có những cánh đồng ngô hoặc lúa mì rất lớn, các thị trấn cách xa nhau.\\nKhoảng một phần tư người Mỹ sống ngoài thành phố và thị trấn vì cuộc sống ở đó khó khăn hơn. Cửa hàng, bưu điện, bệnh viện, trường học có thể ở xa và người dân nông thôn mất nhiều thời gian để đến đó. Tuy nhiên, nhiều người chọn sống ở nông thôn vì môi trường an toàn, sạch sẽ và hấp dẫn. Con cái họ thường chuyển đến thị trấn hoặc thành phố khi trưởng thành.',items:[
['Few Americans live in areas with wild and beautiful scenery.',['True','False'],0,'Bài đọc nói “Few Americans live...” nên phát biểu là đúng.','Rất ít người Mỹ sống ở những vùng có phong cảnh hoang sơ và tươi đẹp.'],
['There are large fields of corn or wheat in Midwestern states.',['True','False'],0,'Đoạn văn nêu rõ các bang Trung Tây có những cánh đồng ngô hoặc lúa mì rất lớn.','Có những cánh đồng ngô hoặc lúa mì lớn ở các bang Trung Tây.'],
['About half of Americans live outside cities and towns.',['True','False'],1,'Bài đọc nói khoảng một phần tư (a quarter), không phải một nửa.','Khoảng một nửa người Mỹ sống ngoài thành phố và thị trấn.'],
['People choose the countryside because it is noisy and polluted.',['True','False'],1,'Bài đọc nói môi trường nông thôn an toàn, sạch sẽ và hấp dẫn.','Mọi người chọn nông thôn vì nơi đó ồn ào và ô nhiễm.'],
['Children of rural people often move to towns or cities when they grow up.',['True','False'],0,'Câu cuối nêu trực tiếp điều này.','Con cái của người dân nông thôn thường chuyển đến thị trấn hoặc thành phố khi trưởng thành.']
]}]},
{title:'Unit 3 – Teenagers',sets:[
{title:'Bài 1 – School clubs (điền từ)',passage:'Studies have proven that school club activities are important to both the physical and mental development of children. In sports clubs kids play sports regularly, and under the guidance of their (1) _____ they improve their physical health. Moreover, children mix with friends from different classes in a new (2) _____ where they can learn, share, and appreciate each other. Also, when they work with new friends in a club, they will become more confident and independent. Furthermore, when children work together in a (3) _____ to deal with a problem or to do tasks, they have to work together to think about what they should do to (4) _____ the task. They, therefore, can learn research and leadership (5) _____. Many kids also find good role (6) _____ in clubs, such as coaches or group leaders.',vi:'Các nghiên cứu đã chứng minh hoạt động câu lạc bộ ở trường quan trọng đối với sự phát triển thể chất và tinh thần của trẻ. Trong câu lạc bộ thể thao, trẻ chơi thể thao thường xuyên và dưới sự hướng dẫn của huấn luyện viên, sức khỏe thể chất được cải thiện. Trẻ cũng giao lưu với bạn từ các lớp khác trong môi trường mới, nơi các em học hỏi, chia sẻ và trân trọng nhau. Khi làm việc với bạn mới, các em trở nên tự tin và độc lập hơn. Khi cùng làm việc trong một nhóm để giải quyết vấn đề hoặc hoàn thành nhiệm vụ, các em phải cùng suy nghĩ cách hoàn thành nhiệm vụ. Vì vậy, các em học được kỹ năng nghiên cứu và lãnh đạo. Nhiều trẻ còn tìm được hình mẫu tốt trong câu lạc bộ, như huấn luyện viên hoặc trưởng nhóm.',items:[
['Blank (1): under the guidance of their _____.',['coaches','trainees','monitors','peers'],0,'Trong câu lạc bộ thể thao, trẻ được hướng dẫn bởi coaches (huấn luyện viên).','Dưới sự hướng dẫn của huấn luyện viên, trẻ cải thiện sức khỏe thể chất.'],
['Blank (2): in a new _____.',['surrounding','atmosphere','neighbourhood','environment'],3,'“A new environment” nghĩa là một môi trường mới.','Trẻ giao lưu với bạn trong một môi trường mới.'],
['Blank (3): work together in a _____.',['group','team','band','gang'],1,'“Work together in a team” là cùng làm việc trong một đội/nhóm.','Trẻ làm việc cùng nhau trong một nhóm để giải quyết vấn đề.'],
['Blank (4): what they should do to _____ the task.',['complete','make','do','create'],0,'“Complete the task” nghĩa là hoàn thành nhiệm vụ.','Các em nghĩ cách hoàn thành nhiệm vụ.'],
['Blank (5): research and leadership _____.',['knowledge','skills','tasks','jobs'],1,'Cụm “research and leadership skills” nghĩa là kỹ năng nghiên cứu và lãnh đạo.','Các em có thể học kỹ năng nghiên cứu và lãnh đạo.'],
['Blank (6): good role _____ in clubs.',['idols','figures','models','names'],1,'“Role figures” là những người làm hình mẫu/nhân vật để noi theo.','Trẻ có thể tìm được hình mẫu tốt trong câu lạc bộ.']
]},
{title:'Bài 2 – Conversation with Vy (True / False)',passage:'Ms Kate: Hi Vy. Why don’t you join with your classmates in playing shuttlecock over there?\\nVy: I’d like to. But they may not want me to join.\\nMs Kate: Have you asked them yet?\\nVy: I’m pretty sure that they will not let me join. They laugh at me in our maths class. I don’t like maths, and I’m not good at it.\\nMs Kate: Alright, Vy. So what subjects are you interested in?\\nVy: English and history. I love reading about things that happened in the past. I can read in English, and I easily remember events.\\nMs Kate: Wow. Not everyone does well in those subjects. You should be proud of that. So, you want to become a historian?\\nVy: Definitely, Miss. But my classmates all laughed at me when I told them.\\nMs Kate: Don’t be nervous, Vy. You should be more confident in your abilities and don’t be afraid to show others what you can do.',vi:'Cô Kate: Chào Vy. Sao em không tham gia chơi đá cầu với các bạn cùng lớp ở đằng kia?\\nVy: Em muốn ạ, nhưng có thể các bạn không muốn em tham gia.\\nCô Kate: Em đã hỏi các bạn chưa?\\nVy: Em khá chắc họ sẽ không cho em tham gia. Họ cười em trong giờ toán. Em không thích toán và cũng không giỏi môn đó.\\nCô Kate: Vậy em thích môn nào?\\nVy: Tiếng Anh và lịch sử. Em thích đọc về những việc đã xảy ra trong quá khứ. Em đọc được tiếng Anh và dễ nhớ các sự kiện.\\nCô Kate: Không phải ai cũng học tốt các môn đó. Em nên tự hào. Vậy em muốn trở thành nhà sử học à?\\nVy: Vâng, thưa cô. Nhưng các bạn cùng lớp đều cười em khi em nói vậy.\\nCô Kate: Đừng lo lắng, Vy. Em nên tự tin hơn vào khả năng của mình và đừng ngại cho người khác thấy em có thể làm gì.',items:[
['Vy is sure her classmates will let her join their game.',['True','False'],1,'Vy nói cô khá chắc các bạn sẽ không cho mình tham gia.','Vy chắc rằng các bạn sẽ cho mình tham gia trò chơi. (Sai)'],
['Vy doesn’t like maths and isn’t good at it.',['True','False'],0,'Vy nói trực tiếp rằng mình không thích toán và không giỏi toán.','Vy không thích toán và không giỏi môn này. (Đúng)'],
['Vy is interested in English and history.',['True','False'],0,'Khi cô Kate hỏi, Vy trả lời “English and history”.','Vy quan tâm đến tiếng Anh và lịch sử. (Đúng)'],
['Vy’s classmates laughed when she said she wanted to be a historian.',['True','False'],0,'Vy nói các bạn cùng lớp đã cười khi cô kể mong muốn đó.','Các bạn cùng lớp cười khi Vy nói muốn trở thành nhà sử học. (Đúng)'],
['Vy feels very confident about her abilities.',['True','False'],1,'Cô Kate khuyên Vy tự tin hơn, cho thấy Vy đang thiếu tự tin.','Vy rất tự tin vào khả năng của mình. (Sai)'],
['Ms Kate encourages Vy to show others what she can do.',['True','False'],0,'Cô Kate khuyên Vy đừng ngại cho người khác thấy khả năng của mình.','Cô Kate khuyến khích Vy thể hiện khả năng của mình. (Đúng)']
]},
{title:'Bài 3 – School bulletin',passage:'BRIGHT STARS MIDDLE SCHOOL – DAILY BULLETIN\\nMonday, 10th October\\nPRELIMINARY ENGLISH TEST: PET registration begins on Tuesday, 11th October and the test will be on 20th October. Please sign up before the 15th. Make sure you all have a good night’s sleep before the test day. Your results will be available on the 25th.\\nLINK TEAM: Link Team is currently receiving applications for the next school year. If you want to help our new juniors, come to Room 201 after school to pick up an application.\\nSPORTS: Swimming Club registration is for 8th and 9th grade students in Room 303. For the charity jogging event, fill in the application before Thursday.\\nCLUBS: Photo Club – only two weeks left to get ready for this year’s photo contest. Ask your art teacher for an entry form. Chess Club opens next month and meets on Saturday mornings, 8:00–11:00 a.m.',vi:'TRƯỜNG THCS BRIGHT STARS – BẢN TIN HẰNG NGÀY\\nThứ Hai, ngày 10 tháng 10\\nBÀI THI TIẾNG ANH SƠ CẤP: Đăng ký PET bắt đầu thứ Ba, ngày 11 tháng 10; kỳ thi diễn ra ngày 20 tháng 10. Vui lòng đăng ký trước ngày 15. Hãy ngủ đủ giấc trước ngày thi. Kết quả có vào ngày 25.\\nNHÓM LINK: Nhóm Link đang nhận đơn cho năm học tới. Nếu muốn giúp học sinh mới, hãy đến phòng 201 sau giờ học để lấy đơn.\\nTHỂ THAO: Học sinh lớp 8 và 9 đăng ký Câu lạc bộ Bơi ở phòng 303. Với sự kiện chạy bộ từ thiện, hãy điền đơn trước thứ Năm.\\nCÂU LẠC BỘ: Câu lạc bộ Ảnh còn hai tuần để chuẩn bị cho cuộc thi ảnh năm nay. Hỏi giáo viên mỹ thuật để lấy mẫu đơn. Câu lạc bộ Cờ vua mở vào tháng tới và sinh hoạt sáng thứ Bảy từ 8 đến 11 giờ.',items:[
['How often does Bright Stars Middle School send a bulletin?',['Every day','Every week','Every month','Every year'],0,'Tiêu đề ghi “Daily Bulletin”, nghĩa là bản tin hằng ngày.','Trường gửi bản tin mỗi ngày.'],
['When should students sign up for PET?',['Before the 15th','On the 20th','After the 25th','After the test'],0,'Bản tin ghi rõ “Please sign up before the 15th”.','Học sinh phải đăng ký PET trước ngày 15.'],
['Who can register for the Swimming Club?',['All students','Only grade 6 students','Grade 8 and 9 students','Teachers only'],2,'Thông báo bơi lội hướng đến học sinh lớp 8 và lớp 9.','Học sinh lớp 8 và 9 có thể đăng ký Câu lạc bộ Bơi.'],
['What should students do to join the charity jogging event?',['Ask their art teacher','Fill in the application before Thursday','Go to Room 201','Register after Thursday'],1,'Bản tin yêu cầu điền đơn đăng ký trước thứ Năm.','Học sinh cần điền đơn trước thứ Năm để tham gia chạy bộ từ thiện.'],
['How long is left before the photo contest?',['Two days','Two weeks','One month','One year'],1,'Bản tin nói “only two weeks left”.','Cuộc thi ảnh sẽ diễn ra sau hai tuần.'],
['When will the Chess Club open?',['This Saturday','Next month','In two weeks','Yesterday'],1,'Thông báo ghi “Chess Club: Open next month”.','Câu lạc bộ Cờ vua sẽ mở vào tháng tới.']
]}]}
];
let answers={},qIndex={};
function unlock(){if(document.getElementById('pw').value==='367'){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';init()}else document.getElementById('msg').textContent='Mật khẩu chưa đúng.'}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
function init(){const tabs=document.getElementById('tabs'),root=document.getElementById('units');units.forEach((u,ui)=>{answers[ui]=u.sets.map(s=>s.items.map(()=>null));u.sets.forEach((s,si)=>qIndex[`${ui}_${si}`]=0);let t=document.createElement('button');t.className='btn tab'+(!ui?' active':'');t.textContent=u.title;t.onclick=()=>showUnit(ui);tabs.appendChild(t);let section=document.createElement('section');section.id='unit'+ui;section.className='unit'+(!ui?' active':'');section.innerHTML=`<div id="sets${ui}" class="tabs"></div><div id="content${ui}"></div>`;root.appendChild(section);u.sets.forEach((s,si)=>{let st=document.createElement('button');st.className='btn tab'+(!si?' active':'');st.textContent=s.title;st.onclick=()=>showSet(ui,si);document.getElementById('sets'+ui).appendChild(st);let d=document.createElement('div');d.className='panel';d.id=`set${ui}_${si}`;d.style.display=si?'none':'block';d.innerHTML=`<div class="meta"><h2>${s.title}</h2><div id="score${ui}_${si}" class="score"></div></div><div class="progress"><div id="bar${ui}_${si}"></div></div><div class="qnav" id="nav${ui}_${si}"></div><div id="q${ui}_${si}"></div><div class="navrow"><button class="btn secondary" id="prev${ui}_${si}" onclick="move(${ui},${si},-1)">← Câu trước</button><div><button class="btn secondary" onclick="resetSet(${ui},${si})">Reset phần này</button> <button class="btn" id="next${ui}_${si}" onclick="move(${ui},${si},1)">Câu tiếp →</button></div></div>`;document.getElementById(`content${ui}`).appendChild(d);render(ui,si)})})}
function showUnit(ui){document.querySelectorAll('.unit').forEach((e,i)=>e.classList.toggle('active',i===ui));document.querySelectorAll('#tabs .tab').forEach((e,i)=>e.classList.toggle('active',i===ui))}
function showSet(ui,si){document.querySelectorAll(`#sets${ui} .tab`).forEach((e,i)=>e.classList.toggle('active',i===si));units[ui].sets.forEach((_,i)=>document.getElementById(`set${ui}_${i}`).style.display=i===si?'block':'none')}
function render(ui,si){let s=units[ui].sets[si],idx=qIndex[`${ui}_${si}`],it=s.items[idx],ans=answers[ui][si][idx],nav=document.getElementById(`nav${ui}_${si}`);nav.innerHTML='';s.items.forEach((_,i)=>{let b=document.createElement('button');b.className='qnum'+(answers[ui][si][i]!==null?' done':'')+(i===idx?' current':'');b.textContent=i+1;b.onclick=()=>{qIndex[`${ui}_${si}`]=i;render(ui,si)};nav.appendChild(b)});let left=`<div class="pane"><h3>Reading passage</h3><div>${s.passage.replace(/\n/g,'<br>')}</div><div class="translation"><b>Bản dịch tiếng Việt</b><div>${s.vi.replace(/\n/g,'<br>')}</div></div></div>`;let right=`<div class="pane"><h3>Question ${idx+1}/${s.items.length}</h3><div class="question">${it[0]}</div><div class="options">`;it[1].forEach((o,oi)=>{let cls='opt';if(ans!==null){if(oi===it[2])cls+=' correct';else if(oi===ans)cls+=' wrong'}right+=`<button class="${cls}" ${ans!==null?'disabled':''} onclick="answer(${ui},${si},${idx},${oi})">${String.fromCharCode(65+oi)}. ${o}</button>`});right+='</div>';if(ans!==null){let ok=ans===it[2];right+=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'✓ Chính xác!':'✗ Chưa chính xác.'}</b><p><b>Đáp án đúng:</b> ${String.fromCharCode(65+it[2])}. ${it[1][it[2]]}</p><p><b>Giải thích:</b> ${it[3]}</p><p><b>Nghĩa tiếng Việt:</b> ${it[4]}</p></div>`}right+='</div>';document.getElementById(`q${ui}_${si}`).innerHTML=`<div class="small">Câu ${idx+1}/${s.items.length}. Chọn một đáp án; sau khi chọn sẽ bị khóa.</div><div class="layout">${left}${right}</div>`;document.getElementById(`prev${ui}_${si}`).disabled=idx===0;document.getElementById(`next${ui}_${si}`).disabled=idx===s.items.length-1;let done=answers[ui][si].filter(x=>x!==null).length,score=answers[ui][si].filter((x,i)=>x===s.items[i][2]).length;document.getElementById(`score${ui}_${si}`).textContent=`Điểm: ${score}/${s.items.length} · Đã làm ${done}/${s.items.length}`;document.getElementById(`bar${ui}_${si}`).style.width=done/s.items.length*100+'%'}
function answer(ui,si,idx,choice){if(answers[ui][si][idx]!==null)return;answers[ui][si][idx]=choice;render(ui,si)}
function move(ui,si,delta){let k=`${ui}_${si}`;qIndex[k]=Math.max(0,Math.min(units[ui].sets[si].items.length-1,qIndex[k]+delta));render(ui,si)}
function resetSet(ui,si){if(!confirm('Bạn muốn xóa điểm và làm lại phần này?'))return;answers[ui][si]=units[ui].sets[si].items.map(()=>null);qIndex[`${ui}_${si}`]=0;render(ui,si)}
</script></body></html>
